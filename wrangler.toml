name = "instrumentacion"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Dominio que se imprime adentro de cada QR. Tiene que ser el definitivo antes
# de imprimir el primer pliego: cambiarlo obliga a reimprimir las etiquetas.
# Cuanto mas corto, menos denso el QR y mejor lee una etiqueta gastada.
DOMINIO_PUBLICO = ""

[[d1_databases]]
binding = "DB"
database_name = "instrumentacion"
# Reemplazar por el id real luego de `wrangler d1 create instrumentacion`.
# En local y en los tests este valor no se usa.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
