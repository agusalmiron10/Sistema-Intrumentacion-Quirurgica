name = "instrumentacion"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Dominio que se imprime adentro de cada QR. Tiene que ser el definitivo antes
# de imprimir el primer pliego: cambiarlo obliga a reimprimir las etiquetas.
# Cuanto mas corto, menos denso el QR y mejor lee una etiqueta gastada.
DOMINIO_PUBLICO = ""

# OJO: SESION_SECRET NO va aca y no puede volver a ponerse aca.
#
# En Cloudflare las vars de wrangler.toml y los secrets comparten namespace: si
# el nombre esta declarado en [vars], cada `wrangler deploy` pisa el secreto
# real con el valor del archivo. Ademas, este archivo esta en un repositorio, y
# con ese valor cualquiera puede firmar un token de sesion valido.
#
# En produccion:  npx wrangler secret put SESION_SECRET
# En local:       copiar .dev.vars.example a .dev.vars (esta en .gitignore)

# La PWA se sirve desde el mismo Worker que la API: mismo origen, sin CORS ni
# cookies cross-site, y un solo deploy.
[assets]
directory = "web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "instrumentacion"
# Reemplazar por el id real luego de `wrangler d1 create instrumentacion`.
# En local y en los tests este valor no se usa.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
